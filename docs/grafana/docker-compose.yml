# Prometheus and Grafana for an Intellagent board, in one command:
#   docker compose up -d        (from this folder)
# then open http://localhost:3000 (the Intellagent dashboard opens first).
#
# Before the first run: switch on "metrics": { "prometheus": true } in the board's manifest, add
# "allowedHosts": ["host.docker.internal"] there too (containers reach the board under that name), restart the
# board, and save the metrics token (intellagent token --metrics) to ./metrics.token here. That file is git-ignored.
# Both ports listen on 127.0.0.1 only: nothing here is reachable from your network.
services:
  # The dashboard asks for its data source on a manual import (${DS_PROMETHEUS}); fill it in for provisioning.
  dashboard-prep:
    image: alpine:3.20
    volumes:
      - ./intellagent.json:/src/intellagent.json:ro
      - dashboards:/dashboards
    command: ["sh", "-c", "sed 's/[$]{DS_PROMETHEUS}/prometheus/g' /src/intellagent.json > /dashboards/intellagent.json"]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics.token:/etc/prometheus/intellagent-metrics.token:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # local only (127.0.0.1): view without signing in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/dashboards/intellagent.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - dashboards:/etc/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      dashboard-prep:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  dashboards: {}
  prometheus-data: {}
  grafana-data: {}
